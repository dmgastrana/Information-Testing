name: Weekly Expiration Alert

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday at 6 AM PST
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run expiration script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_SENDER: ${{ secrets.ALERT_SENDER }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: node send-alert.js
